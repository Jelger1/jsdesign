# Bouwt de site (npm run build), controleert de build en publiceert de map dist/ op GitHub Pages.
#
# Wanneer:
# - bij elke push op main;
# - elke nacht om 03:15 UTC: introductieprijzen en deadlines hangen van de datum af en veranderen pas op de site
#   bij een nieuwe build;
# - handmatig: Actions > "Site bouwen en publiceren" > Run workflow.
#
# Productie is de standaard sinds de livegang op jelgersdesign.nl (27 oktober 2026; het custom domain staat bij
# Settings > Pages, een CNAME-bestand telt bij Actions niet): indexeerbaar, analytics na toestemming, de sitemap in
# robots.txt en de site op de hoofdmap. Twee repo-variabelen (Settings > Secrets and variables > Actions > Variables)
# kunnen dat overschrijven:
# - SITE_MODE: "preview" = overal noindex, geen analytics en geen sitemap in robots.txt;
# - BASE_PATH: "/jsdesign/" = de site in een submap, zoals de oude preview op https://jelger1.github.io/jsdesign/.
# Terug naar een preview (terugvalmatrix §10.3), in deze volgorde: haal eerst bij Settings > Pages het custom domain
# jelgersdesign.nl weg (of zet de DNS terug), zet daarna SITE_MODE op "preview" en BASE_PATH op "/jsdesign/" en start de
# workflow opnieuw. Andersom bouwt hij met BASE_PATH /jsdesign/ terwijl de site nog op de hoofdmap van jelgersdesign.nl
# draait; dan wijzen onder meer de paden in 404.html naar jelgersdesign.nl/jsdesign/... en breken ze.
#
# In productiemodus moet npm run check hier zonder uitzondering slagen: er mag niets meer naar jelgers3d.nl of
# jelgersieler.nl linken.
# npm run contract houdt elke publicatie tegen zodra dist/ afwijkt van de oude webshop, ook bij een bewuste wijziging
# (een nieuw product, een andere prijs, een nieuwe sleutel in winkel.json) en ook de nachtelijke build. Leg zo'n
# afwijking in dezelfde commit vast in AFWIJKINGEN in tools/contract.mjs (zie de README).
#
# Let op: in een openbare repo zet GitHub geplande workflows uit na 60 dagen zonder activiteit in de repo. Dan stopt
# de nachtelijke build zonder melding, en blijft bijvoorbeeld een verlopen introductieprijs op de site staan.
# Zet hem dan weer aan bij Actions > "Site bouwen en publiceren" (Enable workflow); elke push telt als activiteit.
name: Site bouwen en publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk. Een lopende publicatie maakt hij af; een nieuwere wacht daarop.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_MODE: ${{ vars.SITE_MODE || 'productie' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Echte lastmod-datums in de sitemap: de build vergelijkt elke pagina met de stand van de vorige publicatie
      # (.sitemap-stand.json, zie build.js stap 6). Ontbreekt die (eerste keer, of na 7 dagen zonder build), dan
      # krijgt elke pagina eenmalig de datum van vandaag.
      - uses: actions/cache/restore@v4
        with:
          path: .sitemap-stand.json
          key: sitemap-stand-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sitemap-stand-
      - run: npm run build
      # Links, SEO-tags en indexering, in de modus van deze build
      - run: npm run check
      - run: npm test
      # Alles wat de oude webshop leverde (pagina's, mailbestanden, beelden, winkel.json, feed) bestaat nog
      - run: npm run contract
      # Pas na alle controles: een build die niet live gaat, verschuift geen lastmod
      - uses: actions/cache/save@v4
        with:
          path: .sitemap-stand.json
          key: sitemap-stand-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
