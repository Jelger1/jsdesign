<!-- Inhoud van de contactpagina. {{...}} wordt door build.js ingevuld (zie contactPage in src/templates/pages.js).
     Het formulier is dat van de oude homepage, 1-op-1; src/js/forms.js verstuurt het. -->
<div class="container contact-page">
	<header class="section-head">
		<p class="kicker">Contact</p>
		<h1>Neem contact op</h1>
		<p class="section-intro">Stel je vraag of deel je idee: je krijgt antwoord van mij persoonlijk.</p>
	</header>

	<form id="contact-form" class="contact-form" novalidate>
		<input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
		<div class="contact-form-card">
			<div class="form-group">
				<label for="cf-name">Naam</label>
				<div class="input-wrap">
					<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
					<input type="text" id="cf-name" name="name" required autocomplete="name" placeholder="Je volledige naam">
				</div>
			</div>
			<div class="form-group">
				<label for="cf-email">E-mailadres</label>
				<div class="input-wrap">
					<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
					<input type="email" id="cf-email" name="email" required autocomplete="email" placeholder="je@email.nl">
				</div>
			</div>
			<div class="form-group">
				<label for="cf-message">Bericht</label>
				<textarea id="cf-message" name="message" rows="4" required placeholder="Vertel me kort over je vraag of idee..."></textarea>
			</div>
			{{nieuwsbriefCheckbox}}
			{{privacyCheckbox}}
			<button type="submit" class="btn primary btn-block">Verstuur bericht</button>
			<p id="form-msg" class="form-msg" aria-live="polite"></p>
		</div>
	</form>

	<p class="contact-direct">Liever direct? Mail naar {{emailLink}} of stuur een bericht via <a href="{{instagram}}" target="_blank" rel="noopener">Instagram<span class="sr-only"> (opent in een nieuw venster)</span></a>.</p>
</div>
